name: Mali 源码镜像检查

on:
  push:
    branches:
      - mali
      - "sync/upstream-*"
  pull_request:
    branches:
      - mali
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mali-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: 校验官方基线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 检查版本记录
        shell: bash
        run: |
          set -euo pipefail
          source .mali/upstream.env
          [[ "$UPSTREAM_REPOSITORY" == "Wei-Shaw/sub2api" ]]
          [[ "$UPSTREAM_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CUSTOM_RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ops\.[1-9][0-9]*$ ]]
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --force upstream \
            "refs/tags/${UPSTREAM_RELEASE}:refs/tags/${UPSTREAM_RELEASE}"
          test "$(git rev-parse "${UPSTREAM_RELEASE}^{commit}")" = "$UPSTREAM_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD

  image:
    name: 构建源码候选镜像
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sub2api-mali
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: 读取候选镜像信息
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          source .mali/upstream.env
          {
            echo "version=$CUSTOM_RELEASE"
            echo "tag=${IMAGE_NAME}:candidate-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并按需推送源码候选镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.candidate.outputs.tag }}
          build-args: |
            VERSION=${{ steps.candidate.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.version }}
          cache-from: type=gha,scope=mali-source
          cache-to: type=gha,mode=max,scope=mali-source

      - name: 写入候选镜像摘要
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "## Mali 源码候选镜像"
            echo
            echo "- 版本：\`$VERSION\`"
            echo "- 候选镜像：\`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
            echo "- 用途：仅供本地隔离验收，不会升级生产服务器"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "源码候选版本：$VERSION"
          echo "候选镜像：${IMAGE_NAME}@${IMAGE_DIGEST}"
