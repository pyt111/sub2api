name: Mali 源码镜像检查

on:
  push:
    branches:
      - mali
      - "sync/upstream-*"
  pull_request:
    branches:
      - mali
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mali-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: 校验官方基线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 检查版本记录
        shell: bash
        run: |
          set -euo pipefail
          source .mali/upstream.env
          [[ "$UPSTREAM_REPOSITORY" == "Wei-Shaw/sub2api" ]]
          [[ "$UPSTREAM_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CUSTOM_RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ops\.[1-9][0-9]*$ ]]
          test "$(git rev-parse "${UPSTREAM_RELEASE}^{}")" = "$UPSTREAM_COMMIT"

  image:
    name: 构建 linux/amd64 镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: 验证完整源码镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: sub2api-mali:check
          cache-from: type=gha,scope=mali-source
          cache-to: type=gha,mode=max,scope=mali-source
